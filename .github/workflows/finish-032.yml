name: Finish 0.3.2 workspace

on:
  push:
    branches:
      - release/0.3.2-crm-workspace

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize prepared 0.3.2 source
        run: |
          cat .bfcamel-payload/chunk* | base64 -d > /tmp/bfcamel032.tar.xz
          echo "e6b5ebc6cf60cfa7426f5d75d1d1348deefdd688f30e01f4cdfeab3a82b14d6a  /tmp/bfcamel032.tar.xz" | sha256sum -c -
          tar -xJf /tmp/bfcamel032.tar.xz
          rm -rf .bfcamel-payload
          rm -f .github/workflows/finish-032.yml

      - name: Verify prepared source
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/smoke.php
          php tests/duplicate-load.php

      - name: Commit materialized 0.3.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "BfCamel CRM 0.3.2: CRM workspace improvements"
          git push origin HEAD:release/0.3.2-crm-workspace
