name: Build WordPress release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build the installable ZIP
        type: boolean
        default: false
      publish_release:
        description: Publish the ZIP as a GitHub release (requires build_release)
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Validate source
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/smoke.php
          php tests/duplicate-load.php
          php tests/security.php
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.2', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: bfcamel_crm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, zip
          tools: wp-cli
      - name: Configure isolated test paths
        run: |
          echo "WP_PATH=$RUNNER_TEMP/bfcamel-wordpress" >> "$GITHUB_ENV"
          echo "BFCAMEL_TEST_WP_LOAD=$RUNNER_TEMP/bfcamel-wordpress/wp-load.php" >> "$GITHUB_ENV"
      - name: Install WordPress and seed existing 0.5.6 data
        env:
          TEST_WORDPRESS_VERSION: ${{ matrix.wordpress }}
        run: |
          wp core download --path="$WP_PATH" --version="$TEST_WORDPRESS_VERSION"
          wp config create --path="$WP_PATH" --dbname=bfcamel_crm_test --dbuser=root --dbpass=integration-only --dbhost=127.0.0.1:3306
          wp config set DISABLE_WP_CRON true --raw --path="$WP_PATH"
          wp core install --path="$WP_PATH" --url=http://example.test --title=CRM-test --admin_user=admin --admin_password=integration-only --admin_email=admin@example.test --skip-email
          git worktree add --detach "$RUNNER_TEMP/bfcamel-crm-base" d97473338d9d01275df08e08baa415342fc9584c
          mkdir -p "$WP_PATH/wp-content/plugins/bfcamel-crm"
          rsync -a --exclude='.git' "$RUNNER_TEMP/bfcamel-crm-base/" "$WP_PATH/wp-content/plugins/bfcamel-crm/"
          wp plugin activate bfcamel-crm --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration-seed.php" --path="$WP_PATH"
      - name: Update source without deleting data and run integration tests
        run: |
          rsync -a --exclude='.git' ./ "$WP_PATH/wp-content/plugins/bfcamel-crm/"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration.php" --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/notifications.php" --path="$WP_PATH"

      - name: Browser interface and permission tests
        if: matrix.wordpress == 'latest'
        run: |
          npm install --prefix "$RUNNER_TEMP/crm-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/crm-browser/node_modules/.bin/playwright" install --with-deps chromium
          wp option update home http://127.0.0.1:8899 --path="$WP_PATH"
          wp option update siteurl http://127.0.0.1:8899 --path="$WP_PATH"
          wp user update admin --locale=ru_RU --path="$WP_PATH"
          php -S 127.0.0.1:8899 -t "$WP_PATH" > "$RUNNER_TEMP/crm-ui-server.log" 2>&1 &
          export CRM_PLAYWRIGHT_MODULE="$RUNNER_TEMP/crm-browser/node_modules/playwright"
          export CRM_SCREENSHOTS="$RUNNER_TEMP/crm-ui-screenshots"
          export CRM_UI_ID="$(wp option get bfcamel_crm_ui_test_id --path="$WP_PATH")"
          node tests/browser.cjs
      - name: Upload interface previews
        if: always() && matrix.wordpress == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: crm-interface-previews
          path: ${{ runner.temp }}/crm-ui-screenshots/*.png
          if-no-files-found: ignore

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    needs:
      - validate
      - plugin-check
      - integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y gettext zip rsync

      - name: Build installable WordPress ZIP
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh

      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bfcamel-crm-release
          path: |
            build/bfcamel-crm-*.zip
            build/bfcamel-crm.zip
          if-no-files-found: error

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: '.git,.github,scripts,tests,build'
          exclude-files: '.gitignore'
          include-experimental: false
          ignore-warnings: false

  release:
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bfcamel-crm-release

      - name: Publish installable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versioned_zip="$(find . -maxdepth 1 -type f -name 'bfcamel-crm-*.zip' -print -quit)"
          test -n "$versioned_zip"
          version="$(basename "$versioned_zip" | sed -E 's/^bfcamel-crm-(.+)\.zip$/\1/')"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its immutable assets unchanged."
            exit 0
          fi
          notes_file="$(mktemp)"
          awk -v version="$version" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          test -s "$notes_file"
          printf '\n### Installation\n\nUpload `bfcamel-crm.zip` through Plugins → Add Plugin → Upload Plugin. Do not use GitHub source-code archives.\n' >> "$notes_file"
          gh release create "$tag" \
            "$versioned_zip#BfCamel CRM $version for WordPress" \
            "bfcamel-crm.zip#BfCamel CRM — stable install/update package" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BfCamel CRM $version" \
            --notes-file "$notes_file" \
            --latest

