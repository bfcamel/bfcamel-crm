name: Build WordPress release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Validate source
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/smoke.php
          php tests/duplicate-load.php
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  package:
    needs:
      - validate
      - plugin-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y gettext zip rsync

      - name: Build installable WordPress ZIP
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh

      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bfcamel-crm-release
          path: |
            build/bfcamel-crm-*.zip
            build/bfcamel-crm.zip
          if-no-files-found: error

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: '.git,.github,scripts,tests,build'
          exclude-files: '.gitignore,.wp-env.json'
          include-experimental: false
          ignore-warnings: false

  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bfcamel-crm-release

      - name: Publish installable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versioned_zip="$(find . -maxdepth 1 -type f -name 'bfcamel-crm-*.zip' -print -quit)"
          test -n "$versioned_zip"
          version="$(basename "$versioned_zip" | sed -E 's/^bfcamel-crm-(.+)\.zip$/\1/')"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its immutable assets unchanged."
            exit 0
          fi
          notes_file="$(mktemp)"
          awk -v version="$version" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          test -s "$notes_file"
          printf '\n### Installation\n\nUpload `bfcamel-crm.zip` through Plugins → Add Plugin → Upload Plugin. Do not use GitHub source-code archives.\n' >> "$notes_file"
          gh release create "$tag" \
            "$versioned_zip#BfCamel CRM $version for WordPress" \
            "bfcamel-crm.zip#BfCamel CRM — stable install/update package" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BfCamel CRM $version" \
            --notes-file "$notes_file" \
            --latest
