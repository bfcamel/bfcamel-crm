name: Build WordPress release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y gettext zip rsync

      - name: Build installable WordPress ZIP
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh

      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bfcamel-crm-release
          path: build/bfcamel-crm-*.zip
          if-no-files-found: error
